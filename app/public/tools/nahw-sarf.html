<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أستاذ عبدالله | التطبيق النحوي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF5E9; --paper-2:#F3E9D4; --ink:#242019; --ink-soft:#4B4438;
    --teal:#164B44; --teal-2:#0E332E; --teal-tint:#E1EEEA;
    --gold:#B9862F; --gold-tint:#F3E3BD; --maroon:#7A2A2A; --maroon-tint:#F4DEDE;
    --green:#3F7D5C; --green-tint:#DCEEE3; --line: rgba(36,32,25,0.12);
    --shadow: 0 10px 30px rgba(22,75,68,0.12); --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;overflow-x:hidden;
    background-image:radial-gradient(circle at 8% 12%, rgba(185,134,47,0.08) 0, transparent 40%),radial-gradient(circle at 92% 88%, rgba(22,75,68,0.08) 0, transparent 40%);}
  h1,h2,h3,.kufi{font-family:'Reem Kufi',sans-serif;}
  button{font-family:'Tajawal',sans-serif;cursor:pointer;border:none;}
  #app{max-width:960px;margin:0 auto;padding:18px 18px 60px;min-height:100vh;}
  .screen{display:none;animation:fadeSlide .4s ease;}
  .screen.active{display:block;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 20px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{width:40px;height:40px;flex:none;}
  .brand-text .name{font-family:'Reem Kufi',sans-serif;font-size:18px;color:var(--teal);line-height:1.2;}
  .brand-text .tag{font-size:11px;color:var(--ink-soft);}
  .hero{text-align:center;padding:36px 10px 10px;}
  .hero-mark{width:90px;height:90px;margin:0 auto 16px;}
  .hero h1{font-size:30px;color:var(--teal);margin:0 0 6px;}
  .hero .subtitle{color:var(--gold);font-size:15px;margin:0 0 24px;font-weight:700;}
  .divider{width:110px;height:3px;margin:0 auto 24px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:3px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
  .name-form{max-width:400px;margin:0 auto;}
  .name-form label{display:block;font-weight:700;margin-bottom:10px;color:var(--teal-2);font-size:14px;}
  .name-form input{width:100%;padding:13px 16px;border-radius:12px;border:2px solid var(--line);font-size:16px;font-family:'Tajawal',sans-serif;background:var(--paper);text-align:center;}
  .name-form input:focus{outline:none;border-color:var(--gold);}
  .btn-primary{background:var(--teal);color:#fff;padding:13px 26px;border-radius:12px;font-size:15px;font-weight:700;margin-top:18px;width:100%;transition:all .15s ease;}
  .btn-primary:hover{background:var(--teal-2);transform:translateY(-1px);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn-ghost{background:transparent;color:var(--teal);padding:9px 16px;border-radius:10px;font-weight:700;border:2px solid var(--teal);font-size:13px;}
  .btn-ghost:hover{background:var(--teal-tint);}
  .btn-gold{background:var(--gold);color:#fff;padding:11px 22px;border-radius:12px;font-weight:700;}
  .level-grid{display:grid;gap:14px;margin-top:8px;}
  .level-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);transition:transform .15s ease;}
  .level-card:hover{transform:translateY(-2px);}
  .level-card .num{width:48px;height:48px;border-radius:14px;background:var(--teal-tint);color:var(--teal);display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi',sans-serif;font-size:19px;flex:none;}
  .level-card .info{flex:1;padding:0 14px;}
  .level-card .info h3{margin:0 0 4px;font-size:17px;color:var(--teal-2);}
  .level-card .info p{margin:0;font-size:12.5px;color:var(--ink-soft);}
  .dash-head{background:linear-gradient(135deg,var(--teal),var(--teal-2));color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow);}
  .dash-head .greet{font-size:13px;opacity:.85;margin-bottom:4px;}
  .dash-head .who{font-family:'Reem Kufi',sans-serif;font-size:22px;margin-bottom:14px;}
  .dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .dash-stats .box{background:rgba(255,255,255,0.12);border-radius:12px;padding:9px 4px;text-align:center;}
  .dash-stats .box b{display:block;font-size:18px;font-family:'Reem Kufi',sans-serif;}
  .dash-stats .box span{font-size:10.5px;opacity:.85;}
  .progress-track{background:rgba(255,255,255,0.25);height:7px;border-radius:6px;margin-top:14px;overflow:hidden;}
  .progress-fill{background:var(--gold);height:100%;border-radius:6px;transition:width .5s ease;}
  .section-title{display:flex;align-items:center;gap:10px;margin:20px 0 10px;color:var(--teal-2);}
  .section-title h3{margin:0;font-size:16px;}
  .section-title .line{flex:1;height:1px;background:var(--line);}
  .subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
  .subj-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 14px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease;overflow:hidden;}
  .subj-card:hover{transform:translateY(-3px);}
  .subj-card.locked{cursor:not-allowed;opacity:.5;}
  .subj-card .badge-num{position:absolute;top:9px;left:9px;width:26px;height:26px;}
  .subj-card .subj-title{font-weight:700;font-size:13.5px;color:var(--teal-2);margin:26px 0 8px;line-height:1.4;min-height:38px;}
  .subj-card .subj-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--ink-soft);}
  .stars-mini{color:var(--gold);letter-spacing:1px;font-size:12px;}
  .lock-icon{position:absolute;top:10px;left:10px;font-size:14px;}
  .achv-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .achv-chip{flex:none;background:var(--gold-tint);color:#7a5a13;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;white-space:nowrap;}
  .back-row{margin-bottom:12px;}
  .lesson-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px;}
  .lesson-head h2{margin:0;color:var(--teal-2);font-size:20px;}
  .source-cite{font-size:11.5px;color:var(--ink-soft);background:var(--paper-2);border-radius:10px;padding:8px 12px;margin-bottom:16px;line-height:1.7;}
  .speak-btn{background:var(--teal-tint);color:var(--teal-2);width:36px;height:36px;border-radius:50%;font-size:15px;flex:none;}
  .speak-btn:hover{background:var(--gold-tint);}
  .lesson-sub{font-family:'Reem Kufi',sans-serif;font-size:15px;color:var(--teal);margin:18px 0 8px;}
  .lesson-p{font-size:15.5px;line-height:2;margin:0 0 8px;}
  .obj-list li{margin-bottom:6px;font-size:14.5px;}
  .rule-box{background:var(--teal-tint);border-right:4px solid var(--teal);border-radius:10px;padding:12px 16px;margin:6px 0 14px;}
  .rule-box ul{margin:0;padding-right:18px;}
  .rule-box li{margin-bottom:6px;font-size:14.5px;}
  .example-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;}
  .example-box .ex-ar{font-size:17px;font-weight:700;color:var(--teal-2);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .example-box .ex-tr{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-style:italic;}
  .example-box .ex-exp{font-size:13.5px;margin-top:6px;color:var(--ink);}
  .mistake-box{background:var(--maroon-tint);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13.5px;}
  .review-box{background:var(--gold-tint);border-radius:12px;padding:14px 16px;margin-top:8px;font-size:14.5px;line-height:1.8;}
  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  .hub-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 16px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease;text-align:center;}
  .hub-card:hover{transform:translateY(-3px);}
  .hub-card.locked{opacity:.45;cursor:not-allowed;}
  .hub-card .ic{font-size:28px;margin-bottom:6px;}
  .hub-card h4{margin:0 0 4px;font-size:14.5px;color:var(--teal-2);}
  .hub-card p{margin:0;font-size:11.5px;color:var(--ink-soft);}
  .hub-card .status{margin-top:8px;font-size:11px;font-weight:700;color:var(--green);}
  .quiz-progress{background:var(--paper-2);height:9px;border-radius:6px;overflow:hidden;margin-bottom:6px;}
  .quiz-progress .fill{background:var(--teal);height:100%;transition:width .4s ease;}
  .quiz-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-bottom:12px;}
  .qtype-tag{display:inline-block;background:var(--gold-tint);color:#7a5a13;font-size:11.5px;font-weight:700;padding:4px 11px;border-radius:999px;margin-bottom:10px;}
  .q-text{font-size:18px;font-weight:700;color:var(--teal-2);margin:6px 0 18px;line-height:1.7;display:flex;align-items:flex-start;gap:10px;}
  .opt-grid{display:grid;gap:11px;}
  .opt-btn{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 17px;font-size:15px;text-align:right;transition:all .15s ease;}
  .opt-btn:hover:not(:disabled){border-color:var(--gold);background:var(--gold-tint);}
  .opt-btn.correct{background:var(--green-tint);border-color:var(--green);color:#215838;font-weight:700;}
  .opt-btn.wrong{background:var(--maroon-tint);border-color:var(--maroon);color:var(--maroon);font-weight:700;}
  .opt-btn:disabled{cursor:default;}
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .match-item{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 11px;font-size:13.5px;text-align:center;transition:all .15s ease;margin-bottom:9px;}
  .match-item.sel{border-color:var(--gold);background:var(--gold-tint);}
  .match-item.done{border-color:var(--green);background:var(--green-tint);color:#215838;opacity:.85;}
  .match-item.err{animation:shake .35s;border-color:var(--maroon);}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .order-bank{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:14px;min-height:46px;}
  .order-build{display:flex;flex-wrap:wrap;gap:9px;min-height:52px;background:var(--paper-2);border:2px dashed var(--line);border-radius:12px;padding:11px;margin-bottom:14px;}
  .word-chip{background:#fff;border:2px solid var(--teal);color:var(--teal-2);padding:8px 15px;border-radius:10px;font-size:15px;font-weight:700;}
  .word-chip.in-build{background:var(--teal);color:#fff;}
  .explain-box{background:var(--paper-2);border-radius:12px;padding:13px 15px;margin-top:14px;font-size:14px;line-height:1.8;}
  .explain-box.ok{background:var(--green-tint);}
  .explain-box.bad{background:var(--maroon-tint);}
  .next-row{display:flex;justify-content:flex-end;margin-top:16px;}
  .result-hero{text-align:center;padding:18px 8px;}
  .result-ring{width:140px;height:140px;margin:0 auto 14px;position:relative;}
  .result-ring svg{transform:rotate(-90deg);}
  .result-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Reem Kufi',sans-serif;font-size:28px;color:var(--teal-2);}
  .stars-big{font-size:30px;color:var(--gold);letter-spacing:5px;margin:8px 0;}
  .mistake-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;text-align:right;}
  .mistake-item .q{font-weight:700;color:var(--teal-2);margin-bottom:5px;font-size:14px;}
  .mistake-item .a{font-size:13px;color:var(--ink-soft);}
  .result-actions{display:flex;gap:10px;margin-top:18px;}
  .result-actions button{flex:1;}
  .final-wrap{text-align:center;padding:26px 8px;}
  .final-wrap .trophy{font-size:64px;margin-bottom:12px;}
  .final-wrap h1{color:var(--teal);font-size:25px;}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;margin-top:20px;}
  .badge-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 8px;box-shadow:var(--shadow);}
  .badge-card .ic{font-size:26px;margin-bottom:5px;}
  .badge-card .t{font-size:12px;font-weight:700;color:var(--teal-2);}
  .confetti-piece{position:fixed;top:-20px;width:9px;height:14px;opacity:.9;z-index:999;border-radius:2px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(400deg);opacity:0;}}
  footer.note{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:32px;line-height:1.8;}
  @media (max-width:560px){
    .dash-stats{grid-template-columns:repeat(2,1fr);}
    .hub-grid{grid-template-columns:1fr;}
    .hero h1{font-size:24px;}
    .result-actions{flex-direction:column;}
  }
</style>
</head>

// normalize keys to numbers for level access
const CURRICULUM = {1: CURRICULUM_RAW[1], 2: CURRICULUM_RAW[2], 3: CURRICULUM_RAW[3]};

const BADGES = [
  {id:"start", ic:"🌱", t:"البداية", cond:s=>totalCompleted(s)>=1},
  {id:"half1", ic:"⭐", t:"نصف الطريق", cond:s=>[1,2,3].some(l=>completedInLevel(s,l)>=5)},
  {id:"lvl1", ic:"📘", t:"الباب الأول مكتمل", cond:s=>completedInLevel(s,1)>=10},
  {id:"lvl2", ic:"📗", t:"الباب الثاني مكتمل", cond:s=>completedInLevel(s,2)>=10},
  {id:"lvl3", ic:"📕", t:"الباب الثالث مكتمل", cond:s=>completedInLevel(s,3)>=10},
  {id:"perfect", ic:"💯", t:"إتقان كامل", cond:s=>s.hadPerfect},
  {id:"masterAll", ic:"🧠", t:"بطل تحدي الإتقان", cond:s=>s.masteryAllCount>=10}
];

let state = {
  screen:"welcome", name:"", level:null, points:0,
  progress:{1:{},2:{},3:{}},
  earnedBadges:[], hadPerfect:false, masteryAllCount:0,
  curSubj:null, curTier:null, quiz:null
};

function totalCompleted(s){let c=0;[1,2,3].forEach(l=>{c+=completedInLevel(s,l)});return c;}
function completedInLevel(s,l){return Object.values(s.progress[l]).filter(p=>p&&p.standardDone).length;}
function totalStars(s){let c=0;[1,2,3].forEach(l=>{Object.values(s.progress[l]).forEach(p=>{if(p&&p.stars)c+=p.stars;})});return c;}

function checkBadges(){
  BADGES.forEach(b=>{ if(!state.earnedBadges.includes(b.id) && b.cond(state)) state.earnedBadges.push(b.id); });
}

function speak(text){
  try{
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[_]/g,' '));
      u.lang='ar-SA'; u.rate=0.92;
      window.speechSynthesis.speak(u);
    }
  }catch(e){}
}

function confettiBurst(){
  const colors=['#B9862F','#164B44','#3F7D5C','#7A2A2A','#F3E9D4'];
  for(let i=0;i<50;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';
    el.style.background=colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration=(2+Math.random()*1.5)+'s';
    el.style.animationDelay=(Math.random()*0.4)+'s';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  }
}

const app = document.getElementById('app');
function go(screen){ state.screen=screen; render(); window.scrollTo({top:0,behavior:'smooth'}); }

function render(){
  let html = "";
  if(state.screen==="welcome") html = renderWelcome();
  else if(state.screen==="level") html = renderLevel();
  else if(state.screen==="dashboard") html = renderDashboard();
  else if(state.screen==="lesson") html = renderLesson();
  else if(state.screen==="hub") html = renderHub();
  else if(state.screen==="quiz") html = renderQuiz();
  else if(state.screen==="result") html = renderResult();
  else if(state.screen==="final") html = renderFinal();
  app.innerHTML = `<div class="screen active">${html}</div><footer class="note">أُستاذ عبدالله | التطبيق النحوي — محتوى الدروس والأسئلة أصلي، وعناوين الوحدات وترتيبها موثّقة من فهرس كتاب «التطبيق النحوي» للدكتور عبده الراجحي.</footer>`;
  bindEvents();
}

function renderDashboard(){
  const level = state.level;
  const subs = CURRICULUM[level].subjects;
  const completed = completedInLevel(state, level);
  const pct = Math.round((completed/10)*100);
  const badges = state.earnedBadges.map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);
  return `
  <div class="topbar">
    <div class="brand"><div class="mark">${starIcon('#164B44')}</div><div class="brand-text"><div class="name">التطبيق النحوي</div><div class="tag">${CURRICULUM[level].name}</div></div></div>
    <button class="btn-ghost" id="changeLevelBtn">تغيير المستوى</button>
  </div>
  <div class="dash-head">
    <div class="greet">أهلًا بعودتك</div>
    <div class="who">${escapeHtml(state.name)}</div>
    <div class="dash-stats">
      <div class="box"><b>${state.points}</b><span>النقاط</span></div>
      <div class="box"><b>${totalStars(state)}</b><span>النجوم</span></div>
      <div class="box"><b>${completed}/10</b><span>وحدات مكتملة</span></div>
      <div class="box"><b>${pct}%</b><span>الإنجاز</span></div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>
  ${badges.length?`
  <div class="section-title"><h3>الإنجازات</h3><div class="line"></div></div>
  <div class="achv-row">${badges.map(b=>`<div class="achv-chip">${b.ic} ${b.t}</div>`).join('')}</div>`:''}
  <div class="section-title"><h3>الوحدات</h3><div class="line"></div></div>
  <div class="subject-grid">
    ${subs.map((s,i)=>{
      const p = state.progress[level][i];
      const locked = i>0 && !state.progress[level][i-1]?.standardDone;
      const stars = p?.stars||0;
      return `<div class="subj-card ${locked?'locked':''}" data-subj="${i}">
        ${locked?'<div class="lock-icon">🔒</div>':`<div class="badge-num">${starIcon('#B9862F')}</div>`}
        <div class="subj-title">${i+1}. ${escapeHtml(s.title)}</div>
        <div class="subj-meta">
          <span>${p?.standardDone?'مكتمل ✓':(locked?'مغلق':'ابدأ الآن')}</span>
          <span class="stars-mini">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</span>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

  return `

    <div class="lesson-sub">الشرح</div>

    <div class="lesson-sub">القاعدة</div>
    <div class="rule-box"><ul>${L.rule.map(r=>`<li>${escapeHtml(r)}</li>`).join('')}</ul></div>

    <div class="lesson-sub">أمثلة</div>

      <div class="example-box">
        <div class="ex-ar"><span>${escapeHtml(ex.displayText)}</span><button class="speak-btn" style="width:30px;height:30px;font-size:13px;" data-speak="${escapeAttr(ex.speechText)}">🔊</button></div>

    ${L.exampleAnalysis && L.exampleAnalysis.length? `

    ${L.exampleAnalysis.map(a=>`<div class="example-box"><div class="ex-ar" style="font-size:15px;">${escapeHtml(a.displayText)}</div><div class="ex-exp">${escapeHtml(a.breakdown)}</div></div>`).join('')}

    <div class="lesson-sub">أخطاء شائعة</div>

    <div class="lesson-sub">مراجعة قصيرة</div>
    <div class="review-box">${escapeHtml(L.shortReview)}</div>

    <button class="btn-primary" id="toHubBtn" style="margin-top:16px;">الانتقال إلى التطبيقات والأسئلة</button>
  </div>`;

  const q = qz.qs[qz.idx];
  const total = qz.qs.length;
  const pct = Math.round((qz.idx/total)*100);
  const typeLabel = {mcq:"اختيار من متعدد", tf:"صح أم خطأ؟", fill:"أكمل الفراغ", "استخرج":"استخرج", "أعرب":"أعرب", "صحح الخطأ":"صحح الخطأ", "حدد الوظيفة الإعرابية":"حدد الوظيفة الإعرابية", "صل بين العمودين":"طابق بين العناصر", "رتب الكلمات":"رتب الكلمات", "أسئلة تطبيقية على نص قصير":"تطبيق عملي"}[q.type] || q.type;
  const tierLabel = {quick:"تطبيق سريع", standard:"اختبار قياسي", mastery:"تحدي الإتقان", application:"تطبيق عملي"}[state.curTier];

  let body = "";
  if(q.type==="mcq" || q.type==="tf" || q.type==="fill" || q.type==="استخرج" || q.type==="أعرب" || q.type==="صحح الخطأ" || q.type==="حدد الوظيفة الإعرابية" || q.type==="أسئلة تطبيقية على نص قصير"){
    let options = q.options;
    let correctIdx = q.correctAnswer;
    if(q.type==="tf"){ options = ["صحيح","خطأ"]; correctIdx = q.correctAnswer===true?0:1; }
    body = `
      <div class="q-text"><span>${escapeHtml(q.question)}</span><button class="speak-btn" data-speak="${escapeAttr(q.questionSpeechText||q.question)}">🔊</button></div>
      <div class="opt-grid" id="optGrid" data-correct="${correctIdx}">
        ${options.map((o,i)=>`<button class="opt-btn" data-opt="${i}">${escapeHtml(o)}</button>`).join('')}
      </div>
      <div id="feedbackZone"></div>`;
  } else if(q.type==="صل بين العمودين"){
    if(!qz.matchState){
      const left = q.pairs.map((p,i)=>({text:p[0], pair:i})).sort(()=>Math.random()-.5);
      const right = q.pairs.map((p,i)=>({text:p[1], pair:i})).sort(()=>Math.random()-.5);
      qz.matchState = {left,right,selectedLeft:null,matched:[],wrong:0};
    }
    const ms = qz.matchState;
    body = `
      <div class="q-text"><span>${escapeHtml(q.question)}</span></div>
      <div class="match-wrap">
        <div>${ms.left.map((it,i)=>`<div class="match-item ${ms.selectedLeft===i?'sel':''} ${ms.matched.includes(it.pair)?'done':''}" data-side="left" data-i="${i}">${escapeHtml(it.text)}</div>`).join('')}</div>
        <div>${ms.right.map((it,i)=>`<div class="match-item ${ms.matched.includes(it.pair)?'done':''}" data-side="right" data-i="${i}">${escapeHtml(it.text)}</div>`).join('')}</div>
      </div>
      <div id="feedbackZone"></div>`;
  } else if(q.type==="رتب الكلمات"){
    if(!qz.orderState){
      qz.orderState = {bank:[...q.words].sort(()=>Math.random()-.5), build:[]};
    }
    const os = qz.orderState;
    body = `
      <div class="q-text"><span>${escapeHtml(q.question)}</span></div>
      <div class="order-build" id="buildZone">${os.build.map((w,i)=>`<button class="word-chip in-build" data-buildidx="${i}">${escapeHtml(w)}</button>`).join('')}</div>
      <div class="order-bank" id="bankZone">${os.bank.map((w,i)=>`<button class="word-chip" data-bankidx="${i}">${escapeHtml(w)}</button>`).join('')}</div>
      <button class="btn-gold" id="checkOrderBtn" ${os.bank.length?'disabled':''}>تحقّق من الإجابة</button>
      <div id="feedbackZone"></div>`;
  }

  return `
  <div class="quiz-top"><span>${tierLabel} — ${qz.idx+1} / ${total}</span><span class="qtype-tag">${typeLabel}</span></div>
  <div class="quiz-progress"><div class="fill" style="width:${pct}%"></div></div>
  <div class="card">${body}</div>`;
}

function renderResult(){
  const qz = state.quiz;
  const total = qz.qs.length;
  const pct = Math.round((qz.correct/total)*100);
  let stars = pct>=90?3:pct>=70?2:pct>=50?1:0;
  const circumference = 2*Math.PI*58;
  const dash = circumference*(pct/100);
  const tierLabel = {quick:"تطبيق سريع", standard:"اختبار قياسي", mastery:"تحدي الإتقان", application:"تطبيق عملي"}[state.curTier];
  return `
  <div class="card result-hero">
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:6px;">${tierLabel}</div>
    <div class="result-ring">
      <svg width="140" height="140"><circle cx="70" cy="70" r="58" fill="none" stroke="var(--paper-2)" stroke-width="11"/><circle cx="70" cy="70" r="58" fill="none" stroke="var(--teal)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${dash} ${circumference}"/></svg>
      <div class="pct">${pct}%</div>
    </div>
    <h2 style="margin:4px 0;color:var(--teal-2);font-size:18px;">${qz.correct} من ${total} إجابات صحيحة</h2>
    ${state.curTier==='standard'? `<div class="stars-big">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>`:''}
    ${qz.wrongList.length? `
      <div class="section-title" style="text-align:right;"><h3>مراجعة الأخطاء</h3><div class="line"></div></div>
      ${qz.wrongList.map(w=>`<div class="mistake-item"><div class="q">${escapeHtml(w.q)}</div><div class="a">${escapeHtml(w.explain||'')}</div></div>`).join('')}
    `:`<p style="color:var(--green);font-weight:700;">إجابات ممتازة! 🎉</p>`}
    <div class="result-actions">
      <button class="btn-ghost" id="retryBtn">إعادة المحاولة</button>
      <button class="btn-primary" id="toHubFromResultBtn" style="margin-top:0;">العودة للتطبيقات</button>
    </div>
  </div>`;
}

function renderFinal(){
  const badges = state.earnedBadges.map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);
  return `
  <div class="final-wrap">
    <div class="trophy">🏆</div>
    <h1>مبروكٌ يا ${escapeHtml(state.name)}!</h1>
    <p style="font-size:15px;color:var(--ink-soft);">أكملتَ جميع وحدات ${CURRICULUM[state.level].name} في النحو التطبيقي بنجاحٍ وتفوّقٍ.</p>
    <div class="stars-big">⭐ ${state.points} نقطة</div>
    <div class="badge-grid">${badges.map(b=>`<div class="badge-card"><div class="ic">${b.ic}</div><div class="t">${b.t}</div></div>`).join('')}</div>
    <button class="btn-primary" id="finalDashBtn" style="max-width:280px;margin:24px auto 0;">العودة للوحة التحكم</button>
  </div>`;
}

function bindEvents(){
  const nameInput = document.getElementById('nameInput');
  if(nameInput){
    nameInput.addEventListener('input', e=>{
      state.name = e.target.value;
      const btn = document.getElementById('startBtn');
      if(btn) btn.disabled = !state.name.trim();
    });
    nameInput.addEventListener('keydown', e=>{ if(e.key==='Enter' && state.name.trim()) go('level'); });
  }
  const startBtn = document.getElementById('startBtn');
  if(startBtn) startBtn.addEventListener('click', ()=>go('level'));

  document.querySelectorAll('[data-level]').forEach(el=>{
    el.addEventListener('click', ()=>{ state.level = parseInt(el.dataset.level); go('dashboard'); });
  });
  const changeLevelBtn = document.getElementById('changeLevelBtn');
  if(changeLevelBtn) changeLevelBtn.addEventListener('click', ()=>go('level'));

  document.querySelectorAll('.subj-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.classList.contains('locked')) return;
      state.curSubj = parseInt(el.dataset.subj);
      go('lesson');
    });
  });

  const backDash = document.getElementById('backDash');
  if(backDash) backDash.addEventListener('click', ()=>go('dashboard'));
  const backLesson = document.getElementById('backLesson');
  if(backLesson) backLesson.addEventListener('click', ()=>go('lesson'));

  const toHubBtn = document.getElementById('toHubBtn');
  if(toHubBtn) toHubBtn.addEventListener('click', ()=>go('hub'));
  const toHubFromResultBtn = document.getElementById('toHubFromResultBtn');
  if(toHubFromResultBtn) toHubFromResultBtn.addEventListener('click', ()=>go('hub'));

  document.querySelectorAll('.hub-card').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(el.classList.contains('locked')) return;
      startQuiz(el.dataset.tier);
    });
  });

  document.querySelectorAll('[data-speak]').forEach(el=>{
    el.addEventListener('click', ()=> speak(el.getAttribute('data-speak')));
  });

  const optGrid = document.getElementById('optGrid');
  if(optGrid){
    optGrid.querySelectorAll('.opt-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(state.quiz.answered) return;
        state.quiz.answered = true;
        const q = state.quiz.qs[state.quiz.idx];
        const chosen = parseInt(btn.dataset.opt);
        const correctIdx = parseInt(optGrid.dataset.correct);
        const isCorrect = chosen===correctIdx;
        optGrid.querySelectorAll('.opt-btn').forEach((b,i)=>{
          b.disabled = true;
          if(i===correctIdx) b.classList.add('correct');
          else if(i===chosen) b.classList.add('wrong');
        });
        finishAnswer(isCorrect, q);
      });
    });
  }

  document.querySelectorAll('.match-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qz = state.quiz;
      const q = qz.qs[qz.idx];
      const ms = qz.matchState;
      if(ms.matched.length===q.pairs.length) return;
      const side = el.dataset.side, i = parseInt(el.dataset.i);
      if(side==="left"){
        ms.selectedLeft = i;
        render();
      } else if(ms.selectedLeft!==null){
        const leftItem = ms.left[ms.selectedLeft];
        const rightItem = ms.right[i];
        if(ms.matched.includes(leftItem.pair)) return;
        if(leftItem.pair===rightItem.pair){
          ms.matched.push(leftItem.pair);
          ms.selectedLeft=null;
          render();
          if(ms.matched.length===q.pairs.length){
            setTimeout(()=>finishAnswer(true, q, true), 350);
          }
        } else {
          el.classList.add('err');
          ms.selectedLeft=null;
          setTimeout(()=>render(),400);
        }
      }
    });
  });

  document.querySelectorAll('[data-bankidx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const qz = state.quiz; const os = qz.orderState;
      const i = parseInt(el.dataset.bankidx);
      os.build.push(os.bank[i]);
      os.bank.splice(i,1);
      render();
    });
  });
  document.querySelectorAll('[data-buildidx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      if(state.quiz.answered) return;
      const qz = state.quiz; const os = qz.orderState;
      const i = parseInt(el.dataset.buildidx);
      os.bank.push(os.build[i]);
      os.build.splice(i,1);
      render();
    });
  });
  const checkOrderBtn = document.getElementById('checkOrderBtn');
  if(checkOrderBtn) checkOrderBtn.addEventListener('click', ()=>{
    if(state.quiz.answered) return;
    state.quiz.answered = true;
    const qz = state.quiz; const q = qz.qs[qz.idx]; const os = qz.orderState;
    const isCorrect = JSON.stringify(os.build)===JSON.stringify(q.correctOrder);
    finishAnswer(isCorrect, q);
  });

  const retryBtn = document.getElementById('retryBtn');
  if(retryBtn) retryBtn.addEventListener('click', ()=> startQuiz(state.curTier));
  const finalDashBtn = document.getElementById('finalDashBtn');
  if(finalDashBtn) finalDashBtn.addEventListener('click', ()=>go('dashboard'));
}

function startQuiz(tier){
  const subj = CURRICULUM[state.level].subjects[state.curSubj];
  state.curTier = tier;
  state.quiz = {qs: subj.questions[tier], idx:0, correct:0, wrongList:[], answered:false};
  go('quiz');
}

function finishAnswer(isCorrect, q, isMatch){
  if(isCorrect){ state.quiz.correct++; state.points += 5; }
  else {
    state.quiz.wrongList.push({q: q.question||"سؤال المطابقة", explain: q.explanation || "راجع الدرس لمعرفة الإجابة الصحيحة."});
  }
  const zone = document.getElementById('feedbackZone');
  if(zone){
    zone.innerHTML = `
      <div class="explain-box ${isCorrect?'ok':'bad'}">
        <b>${isCorrect? (isMatch?'أحسنت! طابقت كل العناصر بنجاح ✓':'إجابة صحيحة ✓') : 'إجابة غير صحيحة ✗'}</b>
        ${q.explanation? `<br>${escapeHtml(q.explanation)}`:''}
      </div>
      <div class="next-row"><button class="btn-primary" id="nextQBtn" style="width:auto;margin-top:0;">${state.quiz.idx+1<state.quiz.qs.length?'السؤال التالي':'عرض النتيجة'} ←</button></div>`;
    document.getElementById('nextQBtn').addEventListener('click', nextQuestion);
  }
}

function nextQuestion(){
  const qz = state.quiz;
  qz.idx++;
  qz.answered = false;
  qz.matchState = null;
  qz.orderState = null;
  if(qz.idx>=qz.qs.length){
    finishTier();
  } else {
    render();
  }
}

function finishTier(){
  const qz = state.quiz;
  const pct = Math.round((qz.correct/qz.qs.length)*100);
  const level = state.level, idx = state.curSubj;
  if(!state.progress[level][idx]) state.progress[level][idx] = {};
  const p = state.progress[level][idx];
  const tier = state.curTier;

  if(tier==="quick"){
    p.quickDone = true; state.points += 10;
  } else if(tier==="standard"){
    const stars = pct>=90?3:pct>=70?2:pct>=50?1:0;
    const wasCompleted = p.standardDone;
    p.standardDone = true; p.score = pct; p.stars = Math.max(stars, p.stars||0);
    state.points += 30;
    if(pct===100) state.hadPerfect = true;
    checkBadges();
    go('result');
    if(pct>=80) confettiBurst();
    if(completedInLevel(state, level)>=10){
      setTimeout(()=>{ go('final'); confettiBurst(); }, 1200);
    }
    return;
  } else if(tier==="mastery"){
    p.masteryDone = true; p.masteryScore = pct; state.points += 25;
    state.masteryAllCount = [1,2,3].reduce((n,l)=>n+Object.values(state.progress[l]).filter(x=>x&&x.masteryDone).length,0);
    checkBadges();
  } else if(tier==="application"){
    p.applicationDone = true; state.points += 15;
  }
  go('result');
  if(pct>=80) confettiBurst();
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

render();
</script>
</body>
</html>
